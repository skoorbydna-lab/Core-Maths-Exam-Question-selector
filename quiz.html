<script>
// ===== Multiple-choice builder for the Core Maths generators =====
const MC=(()=>{
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)];
const plain=raw=>F(String(raw)).replace(/<sup>/g,'^').replace(/<sub>/g,'_').replace(/<[^>]+>/g,' ').replace(/&#8203;/g,'√').replace(/&lt;/g,'<').replace(/\s+/g,' ').trim();
const norm=raw=>plain(raw).replace(/\s+/g,'').replace(/-/g,'−').toLowerCase();
const BAD_Q=/\b(show that|prove|explain|sketch|describe|comment|compare|interpret|justify|why|draw|verify|suggest|criticis|give a reason|give two|misleading|state what|in context|how would)/i;
const unc=s=>String(s).replace(/(\d),(?=\d{3}(?!\d))/g,'$1');
const com=s=>s.replace(/(?<![\d.])\d{4,}(?=(\.\d+)?(?!\d))/g,(m,_,o,t)=>m.length>4||/[£€$] ?$|CHF $/.test(t.slice(0,o))?Number(m).toLocaleString('en-GB'):m);
const dps=s=>{const i=s.indexOf('.');return i<0?0:s.length-i-1};
function nudge(v,s){
  const k=dps(s),u=10**-k,c=[];
  if(k==0){
    const step=v>=1000?10**(Math.floor(Math.log10(v))-1):v>=100?P([1,10]):v>=20?P([1,2,10]):1;
    c.push(v+step,v-step,v+2*step,v-2*step);
    if(v%2==0&&v>2)c.push(v/2);if(v>1&&v<60)c.push(v*2);
  }else{
    const n=Math.round(v/u),sp=[1,-1,2,-2,3,-3,10,-10];if(n>200)sp.push(Math.round(n*.1),-Math.round(n*.1));
    sp.forEach(d=>c.push((n+d)*u));
  }
  const ok=c.filter(x=>x>=0&&Math.abs(x-v)>1e-9&&(k||Number.isInteger(x)));
  const x=P(ok.length?ok:[v+(k?u:1)]);return k?x.toFixed(k):String(Math.round(x));
}
const TOK=/\d+(?:\.\d+)?/g;
function perturb(a,qnums){
  const s=String(a),slots=[];let m;TOK.lastIndex=0;
  while((m=TOK.exec(s))){const pre=s.slice(Math.max(0,m.index-2),m.index);if(/_\{?$/.test(pre))continue;slots.push([m.index,m[0]])}
  if(!slots.length)return null;
  let pool=slots.filter(x=>!qnums.has(x[1]));if(!pool.length||Math.random()<.15)pool=slots;
  const t=P(pool);return s.slice(0,t[0])+nudge(+t[1],t[1])+s.slice(t[0]+t[1].length);
}
const valueOf=raw=>{const p=plain(raw).replace(/[£\s]/g,'').replace(/−/g,'-');return/^-?\d+(\.\d+)?$/.test(p)?+p:null};
function build(f,L){
  let q,a,w;try{[q,a,w]=f(L)}catch(e){return null}
  if(typeof q!=='string'||typeof a!=='string')return null;
  if(BAD_Q.test(plain(q)))return null;
  const A=unc(a),pa=plain(A);
  if(!pa||pa.length>95)return null;
  const qnums=new Set(unc(q).match(TOK)||[]);
  const seen=new Set([norm(A)]),val=valueOf(A),opts=[];
  const add=h=>{if(opts.length>=3||!h)return;h=unc(h);const k=norm(h);if(!k||seen.has(k))return;const v=valueOf(h);if(val!=null&&v!=null&&(Math.abs(v-val)<1e-9||(v===0&&val!==0)))return;if(/NaN|Infinity|undefined/.test(h))return;seen.add(k);opts.push(h)};
  (w||[]).forEach(add);
  if(/\d/.test(pa))for(let i=0;i<50&&opts.length<3;i++)add(perturb(A,qnums));
  if(opts.length<3)return null;
  return{q,o:[A,...opts].map(com)};
}
return{build,plain,norm};
})();
</script>
<script>

(() => {
const STR = ['d','f','a','p'];
// written-answer subsections (compare, explain, comment) stay on the Skills Generator only
const WR = new Set(['C:3:3','C:11:2','C:13:3','C:14:3','C:16:3']);
const NQ = 10, REVEAL = 6000, COUNT = 3000;
const R_ = (a,b) => a + Math.floor(Math.random()*(b-a+1)), P_ = a => a[R_(0, a.length-1)];
const $app = document.getElementById('app');
const ld = (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const sv_ = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
const ukDay = (t) => new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit'}).format(t || new Date());
const dayUTC = (d) => { const [y,m,dd] = d.split('-').map(Number); return Date.UTC(y, m-1, dd); };
const addDays = (d, n) => new Date(dayUTC(d) + n*864e5).toISOString().slice(0,10);
const weekStart = (d) => addDays(d, -((new Date(dayUTC(d)).getUTCDay() + 6) % 7)); // Monday
const pretty = (d) => new Date(dayUTC(d)).toLocaleDateString('en-GB', {day:'numeric', month:'short', timeZone:'UTC'});
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const chLabel = (c) => c.n + '. ' + c.nm;
const keysOf = (c) => c.sb.map((_, i) => KK(c, i)).filter(k => G[k] && !WR.has(k));
const chapters = (strand) => CH.filter(c => (strand === 'all' || c.s === strand) && keysOf(c).length);

// ---------- Question selection: questions 1-5 Standard, 6-10 Challenge ----------
function parSecs(q, L){
  let t = L ? 70 : 40;
  if (MC.plain(q.q).length > 110) t += 10;
  if (Math.max(...q.o.map(o => MC.plain(o).length)) > 40) t += 10;
  return Math.min(120, t);
}
function makeQuiz(strand, chap){
  const chs = chap === 'all' ? chapters(strand) : CH.filter(c => chLabel(c) === chap);
  const keys = chs.flatMap(c => keysOf(c).map(k => ({k, c})));
  if (!keys.length) return [];
  const used = new Set(), usedK = new Map(), usedC = new Map(), out = [];
  for (let i = 0; i < NQ; i++){
    const L = i < NQ/2 ? 0 : 1;
    let made = null;
    for (let tries = 0; tries < 60 && !made; tries++){
      let pool = keys.filter(x => !usedK.get(x.k));
      if (!pool.length) pool = keys;
      if (chap === 'all' && tries < 30){ const fresh = pool.filter(x => !usedC.get(x.c)); if (fresh.length) pool = fresh; }
      const x = P_(pool);
      const fns = L && GC[x.k] ? [].concat(GC[x.k]) : [].concat(G[x.k]);
      const m = MC.build(P_(fns), L);
      if (!m) continue;
      const nk = MC.norm(m.q); if (used.has(nk)) continue;
      used.add(nk); usedK.set(x.k, (usedK.get(x.k) || 0) + 1); usedC.set(x.c, (usedC.get(x.c) || 0) + 1);
      made = {...m, topic: x.c.short || x.c.nm, L};
    }
    if (made){
      const order = shuffle(made.o.map((_, j) => j));
      made.opts = order.map(j => made.o[j]); made.right = order.indexOf(0); made.par = parSecs(made, made.L);
      out.push(made);
    }
  }
  return out;
}

// ---------- State ----------
const st = {screen:'home', strand: ld('cq_strand') || 'all', chap: 'all', secs: +(ld('cq_secs') ?? 0) || 0,
  quiz: null, qi: 0, ph: 'c', t0: 0, ans: [], quitArm: 0};
if (st.strand !== 'all' && !SN[st.strand]) st.strand = 'all';
let lastHtml = '';
const qSecs = (q) => st.secs ? st.secs : q.par;
function points(a){ if (!a || !a.ok) return 0; return 500 + Math.round(500 * Math.max(0, 1 - a.ms / (a.par*1000))); }
function total(){ return st.ans.reduce((s, a) => s + points(a), 0); }
function correct(){ return st.ans.filter(a => a && a.ok).length; }
function label(){ return st.chap === 'all' ? (st.strand === 'all' ? 'All topics' : SN[st.strand]) : st.chap; }

// ---------- Rendering ----------
const NAV = `<nav class="sites"><a href="index.html">📝 Exam Question Selector</a><a href="skills.html">✅ Skills Generator</a></nav>`;
function render(){
  if (st.screen === 'home') return NAV + renderHome();
  if (st.screen === 'quiz') return renderQuiz();
  if (st.screen === 'over') return renderOver();
  return '';
}
function selG(id, head, chs, val){
  const o = ([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`;
  return `<select id="${id}">${head.map(o).join('')}${STR.map(s => { const g = chs.filter(c => c.s === s); return g.length ? `<optgroup label="${SN[s]}">${g.map(c => o([chLabel(c), chLabel(c)])).join('')}</optgroup>` : ''; }).join('')}</select>`;
}
function sel(id, opts, val){ return `<select id="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`; }
function renderHome(){
  const strands = STR.filter(s => chapters(s).length);
  if (st.strand !== 'all' && !strands.includes(st.strand)) st.strand = 'all';
  const chs = chapters(st.strand);
  if (st.chap !== 'all' && !chs.some(c => chLabel(c) === st.chap)) st.chap = 'all';
  const chHead = [['all', st.strand === 'all' ? 'Mixed – every chapter' : 'Mixed – all ' + SN[st.strand]]];
  return `<div class="logo">Σ Core Maths <span>Quiz</span></div>
  <p class="sub">10 AQA Core Maths questions against the clock. Fast and right scores most.</p>
  <div class="card">
    <div class="settings">
      <label>Topic area${sel('strand', [['all','All topic areas'], ...strands.map(s => [s, SN[s]])], st.strand)}</label>
      <label>Time each${sel('secs', [[0,'Auto – by difficulty'],[30,'30 s'],[45,'45 s'],[60,'60 s'],[90,'90 s'],[120,'120 s']], st.secs)}</label>
      <label class="wide">Chapter${selG('chap', chHead, chs, st.chap)}</label>
    </div>
    <button class="big primary" data-act="start">Start quiz</button>
    <p class="note">Questions 1–5 are Standard and 6–10 are Challenge. A right answer scores 500, plus up to 500 more for speed — Challenge questions get longer. Have a pen, paper and calculator ready.</p>
  </div>`;
}
function renderQuiz(){
  const q = st.quiz[st.qi], head = `<div class="top"><span class="chip">${esc(label())}</span><button class="leave" data-act="quit">${Date.now() - (st.quitArm || 0) < 4000 ? 'Tap again to quit' : 'Quit'}</button></div>`;
  if (st.ph === 'c') return head + `<div class="card center"><h2>Get ready!</h2><p class="mut">${st.quiz.length} questions · ${st.secs ? st.secs + 's each' : 'timer set by difficulty'}</p><div class="count" id="tnum">3</div><p class="mut">Work it out, then tap your answer.</p></div>`;
  const a = st.ans[st.qi], reveal = st.ph === 'r';
  const long = q.opts.some(o => MC.plain(o).length > 26);
  const btns = q.opts.map((o, i) => {
    const c = ['opt']; if (a && a.i === i) c.push('mine'); if (reveal && i === q.right) c.push('right'); if (reveal && a && a.i === i && i !== q.right) c.push('wrong');
    return `<button class="${c.join(' ')}" data-act="ans" data-i="${i}">${F(o)}</button>`;
  }).join('');
  let below = '';
  if (reveal){
    const pts = points(a);
    below = `<div class="result ${pts ? 'good' : 'bad'}">${pts ? '+' + pts + ' points!' : a && a.i != null ? 'Not quite!' : "Time's up!"}</div>
      ${pts ? '' : `<p class="center mut" style="margin:0">Answer: <b class="ansb">${F(q.o[0])}</b></p>`}
      <p class="center mut" style="margin:10px 0 0">Score: <b style="color:#fff">${fmt(total())}</b></p>
      <button class="big primary" style="margin-top:14px" data-act="next">${st.qi + 1 < st.quiz.length ? 'Next question' : 'See my score'} ▶</button>`;
  }
  return head + `<div class="top" style="margin-bottom:4px"><span class="chip">Q${st.qi+1} of ${st.quiz.length} · ${q.L ? 'Challenge' : 'Standard'}</span><span class="chip tchip">${esc(q.topic)}</span><span class="tnum" id="tnum"></span></div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="qtext">${F(q.q)}</div>
    <div class="opts ${long ? 'long' : ''} ${reveal ? 'reveal' : a ? 'locked' : ''}" id="opts">${btns}</div>${below}`;
}
function renderOver(){
  const s = total(), c = correct();
  const rows = st.quiz.map((q, i) => { const a = st.ans[i], ok = a && a.ok;
    return `<div class="rv ${ok ? 'g' : 'b'}"><span class="rk">${ok ? '✓' : '✗'}</span><span class="rq">${i+1}. ${esc(q.topic)}${ok ? '' : ` — answer <b>${F(q.o[0])}</b>`}</span><span class="sc">${points(a)}</span></div>`; }).join('');
  return `<div class="top"><span class="chip">${esc(label())}</span><button class="leave" data-act="home">Home</button></div>
  <div class="card"><div class="win">${fmt(s)} points</div>
    <p class="center mut" style="margin:0 0 14px">${c} out of ${st.quiz.length} correct</p>
    <div class="board" style="margin-top:18px">${rows}</div>
    <div class="btns"><button class="big primary" data-act="start">Play again</button><button class="big ghost" data-act="home">Change topic</button></div></div>`;
}
function update(){
  const html = render();
  if (html !== lastHtml){ lastHtml = html; $app.innerHTML = html; }
  tickVisuals();
}
function tickVisuals(){
  if (st.screen !== 'quiz') return;
  const el = Date.now() - st.t0, tot = st.ph === 'q' ? qSecs(st.quiz[st.qi])*1000 : COUNT, left = Math.max(0, tot - el);
  const bar = document.getElementById('tbar'); if (bar) bar.style.width = (st.ph === 'q' ? left/tot*100 : 0) + '%';
  const tn = document.getElementById('tnum'); if (tn) tn.textContent = st.ph === 'r' ? '' : Math.max(st.ph === 'c' ? 1 : 0, Math.ceil(left/1000));
  if (bar) bar.classList.toggle('low', st.ph === 'q' && left < 5000);
}

// ---------- Game loop ----------
function tick(){
  if (st.screen !== 'quiz') return;
  const el = Date.now() - st.t0;
  if (st.quitArm && Date.now() - st.quitArm > 4000){ st.quitArm = 0; update(); }
  if (st.ph === 'c' && el >= COUNT){ st.ph = 'q'; st.t0 = Date.now(); update(); }
  else if (st.ph === 'q' && el >= qSecs(st.quiz[st.qi])*1000 + 300){ if (!st.ans[st.qi]) st.ans[st.qi] = {i: null, ok: false, ms: 0, par: st.quiz[st.qi].par}; st.ph = 'r'; st.t0 = Date.now(); update(); }
  else if (st.ph === 'r' && el >= REVEAL + (st.ans[st.qi] && st.ans[st.qi].ok ? 0 : 6000)) next();
  tickVisuals();
}
setInterval(tick, 120);
function next(){
  if (st.qi + 1 < st.quiz.length){ st.qi++; st.ph = 'q'; st.t0 = Date.now(); }
  else { st.screen = 'over'; }
  update();
}

// ---------- Actions ----------
const actions = {
  start(){
    const quiz = makeQuiz(st.strand, st.chap);
    if (quiz.length < 3){ alertMsg('Not enough questions for that choice — try another chapter.'); return; }
    st.quiz = quiz; st.qi = 0; st.ph = 'c'; st.t0 = Date.now(); st.ans = []; st.quitArm = 0; st.screen = 'quiz';
    window.scrollTo(0, 0); update();
  },
  ans(el){
    if (st.ph !== 'q' || st.ans[st.qi]) return;
    const ms = Date.now() - st.t0, q = st.quiz[st.qi]; if (ms > qSecs(q)*1000) return;
    const i = +el.dataset.i; st.ans[st.qi] = {i, ok: i === q.right, ms, par: q.par};
    st.ph = 'r'; st.t0 = Date.now(); update();
  },
  next(){ if (st.ph === 'r') next(); },
  quit(){ if (Date.now() - (st.quitArm || 0) > 4000){ st.quitArm = Date.now(); update(); return; } st.quitArm = 0; st.screen = 'home'; update(); },
  home(){ st.screen = 'home'; update(); },
};
function alertMsg(m){ const n = document.createElement('div'); n.className = 'toast'; n.textContent = m; document.body.appendChild(n); setTimeout(() => n.remove(), 3500); }
$app.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = actions[el.dataset.act]; if (f) f(el); });
$app.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'strand'){ st.strand = e.target.value; st.chap = 'all'; sv_('cq_strand', st.strand); update(); }
  if (id === 'chap'){ st.chap = e.target.value; update(); }
  if (id === 'secs'){ st.secs = +e.target.value; sv_('cq_secs', st.secs); }
});

// ---------- Start ----------
update();
})();

</script>
</body>
</html>
